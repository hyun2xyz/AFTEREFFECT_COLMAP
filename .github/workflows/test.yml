name: Python starter checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-tracking.txt
      - run: python -B -m unittest discover -s tests -v
  audit:
    # Known vulnerabilities in what requirements*.txt would install today (pip-audit reads the PyPI advisory data).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt -r requirements-tracking.txt
  windows-colmap:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Prepare official CPU COLMAP and FFmpeg
        shell: pwsh
        run: |
          $colmapZip = Join-Path $env:RUNNER_TEMP 'colmap.zip'
          $colmapFolder = Join-Path $env:RUNNER_TEMP 'colmap'
          Invoke-WebRequest 'https://github.com/colmap/colmap/releases/download/4.2.1/colmap-x64-windows-nocuda.zip' -OutFile $colmapZip
          $expectedColmapSha = 'c493d88cb4a43f21afba42cb55bf786e5434a0420e73db0ba1454c5d8b3686ae'
          if ((Get-FileHash $colmapZip -Algorithm SHA256).Hash.ToLower() -ne $expectedColmapSha) { throw 'COLMAP asset SHA256 mismatch' }
          Expand-Archive $colmapZip -DestinationPath $colmapFolder
          $colmapExe = Get-ChildItem $colmapFolder -Filter colmap.exe -Recurse | Select-Object -First 1
          if (-not $colmapExe) { throw 'COLMAP executable missing' }
          "COLMAP_BINARY=$($colmapExe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --version=9.0.2 --yes --no-progress }
      - run: python -B scripts/setup_environment.py --configure
      - run: python -B scripts/setup_environment.py --install
      - name: Verify base venv and persistent machine paths
        env:
          COLMAP_BINARY: ''
        run: .\.venv\Scripts\python.exe -B scripts/colmap_ae.py doctor
      - run: .\.venv\Scripts\python.exe -B scripts/setup_environment.py --check
      - run: .\.venv\Scripts\python.exe -B scripts/pointcloud.py --rgb-check --out work/windows-first-rgb
      # CI is a deterministic runner, not an LLM waiting/polling for this process.
      - run: .\.venv\Scripts\python.exe -B tests/smoke_colmap.py --out work/windows-smoke
      - run: python -B scripts/setup_environment.py --install --tracking
      - run: .\.venv\Scripts\python.exe -B tests/smoke_temporal.py --prepared work/windows-smoke/prepared --out work/windows-temporal-smoke
      - run: .\.venv\Scripts\python.exe -B tests/smoke_enrich.py --solution work/windows-temporal-smoke/solve/solution.json --out work/windows-enrich-smoke
